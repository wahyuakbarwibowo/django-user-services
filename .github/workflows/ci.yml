name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Disabled for now. Remove this line to enable.
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check --deploy --fail-level ERROR
        env:
          DJANGO_SECRET_KEY: ci-only-secret
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test

  docker:
    if: ${{ false }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t django-user-services .
